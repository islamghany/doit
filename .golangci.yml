# golangci-lint configuration for Go 1.24
# Compatible with golangci-lint v2.5+

version: 2

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  skip-dirs:
    - bin
    - vendor
    - infra
  skip-files:
    - ".*\\.generated\\.go$"
    - ".*mock.*\\.go$"
    - internal/data/db/.*\\.go$

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - misspell
    - revive
    - prealloc
    - unconvert
    - goconst
    - errname
    - errorlint

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false

  govet:
    enable-all: true
    settings:
      shadow:
        strict: false

  gocyclo:
    min-complexity: 15

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  revive:
    rules:
      - name: exported
        severity: warning
        disabled: false
      - name: package-comments
        severity: warning
        disabled: true
      - name: var-naming
        severity: warning
        disabled: false
        arguments:
          - - "ID"
            - "UUID"
            - "HTTP"
            - "JSON"
            - "API"
            - "URL"
            - "DB"

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - goconst
    - path: internal/data/db/
      linters:
        - all
    - path: mocks/
      linters:
        - all
    - path: migrations/
      linters:
        - all
