# golangci-lint configuration for Go 1.24
# golangci-lint v2.5.0+

version: 2

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

  # Exclude directories
  skip-dirs:
    - bin
    - vendor
    - infra

  # Exclude files
  skip-files:
    - ".*\\.generated\\.go$"
    - ".*mock.*\\.go$"
    - internal/data/db/.*\\.go$ # Exclude sqlc generated code

linters:
  enable:
    # Default linters (always enabled)
    - errcheck # Check for unchecked errors
    - govet # Reports suspicious constructs
    - ineffassign # Detect ineffectual assignments
    - staticcheck # Advanced Go linting (includes gosimple, stylecheck, etc.)
    - unused # Find unused code

    # Additional linters
    - gocyclo # Cyclomatic complexity
    - misspell # Spelling mistakes
    - revive # Fast, configurable linter
    - prealloc # Find slice declarations that could be preallocated
    - unconvert # Remove unnecessary type conversions
    - goconst # Find repeated strings
    - errname # Check error names
    - errorlint # Error wrapping issues

  disable:
    - exhaustive
    - exhaustruct
    - varnamelen
    - nlreturn
    - wsl

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false

  govet:
    enable-all: true
    disable:
      - shadow

  gocyclo:
    min-complexity: 15

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  revive:
    rules:
      - name: exported
        severity: warning
        disabled: false
      - name: package-comments
        severity: warning
        disabled: true
      - name: var-naming
        severity: warning
        disabled: false
        arguments:
          - ["ID", "UUID", "HTTP", "JSON", "API", "URL", "DB"]

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  # Exclude common false positives
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - goconst

    # Exclude sqlc generated files
    - path: internal/data/db/
      linters:
        - all

    # Exclude mock files
    - path: mocks/
      linters:
        - all

    # Allow globals in main and config
    - path: (cmd/.*main\.go|internal/config/)
      text: "G101|G104"

    # Exclude known issues in migration files
    - path: migrations/
      linters:
        - all

output:
  formats:
    colored-line-number:
      path: stdout
  print-issued-lines: true
  print-linter-name: true
  uniq-by-line: true
  sort-results: true
