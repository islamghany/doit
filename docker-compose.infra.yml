# ===========================================
# Infrastructure Only - For Local Go Development
# ===========================================
# Usage:
#   make dev-infra      # Start infrastructure
#   make dev-run        # Run Go API locally
#   make dev-infra-down # Stop infrastructure
# ===========================================

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: doit-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-doit}
      POSTGRES_USER: ${DB_USER:-doit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-doit123}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-doit} -d ${DB_NAME:-doit}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - doit_dev_network
    restart: unless-stopped

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: doit-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - doit_dev_network
    restart: unless-stopped

  # ============================================
  # Jaeger - Distributed Tracing
  # ============================================
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: doit-jaeger-dev
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - doit_dev_network
    restart: unless-stopped

  # ============================================
  # Prometheus - Metrics Collection
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: doit-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dev_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - doit_dev_network
    restart: unless-stopped

  # ============================================
  # Grafana - Metrics Visualization
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: doit-grafana-dev
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/docker/grafana/provisioning-dev:/etc/grafana/provisioning:ro
      - ./infra/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_dev_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - doit_dev_network
    restart: unless-stopped

  # ============================================
  # Adminer - Database Admin UI (Optional)
  # ============================================
  adminer:
    image: adminer:latest
    container_name: doit-adminer-dev
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - doit_dev_network
    restart: unless-stopped

# ============================================
# Networks
# ============================================
networks:
  doit_dev_network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  postgres_dev_data:
    name: doit_postgres_dev_data
  redis_dev_data:
    name: doit_redis_dev_data
  prometheus_dev_data:
    name: doit_prometheus_dev_data
  grafana_dev_data:
    name: doit_grafana_dev_data

