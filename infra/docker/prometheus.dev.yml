# Prometheus configuration for local development
# The API runs on your host machine, not in Docker

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # DoIt API - running on host machine
  # host.docker.internal resolves to host machine from inside Docker
  - job_name: 'doit-api'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

