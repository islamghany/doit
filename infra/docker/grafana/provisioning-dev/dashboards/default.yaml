# Grafana Dashboard Provisioning
# This tells Grafana where to find dashboard JSON files

apiVersion: 1

providers:
  - name: "Default"
    orgId: 1
    folder: "DoIt API"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true

