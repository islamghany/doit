# Grafana Datasource Configuration (Dev Environment)
# Uses Docker network hostnames (not localhost!)
# Grafana runs inside Docker, so it needs to reach other containers by their service names

apiVersion: 1

datasources:
  # ===========================================
  # Prometheus - Metrics
  # ===========================================
  - name: Prometheus
    type: prometheus
    uid: Prometheus
    access: proxy
    # Use Docker service name, NOT localhost
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      # Enable exemplars to link metrics to traces
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: Jaeger
          urlDisplayLabel: "View Trace"

  # ===========================================
  # Jaeger - Distributed Traces
  # ===========================================
  - name: Jaeger
    type: jaeger
    uid: Jaeger
    access: proxy
    # Use Docker service name, NOT localhost
    url: http://jaeger:16686
    editable: false
    jsonData:
      # Link traces to metrics
      tracesToMetrics:
        datasourceUid: Prometheus
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        tags:
          - key: "http.method"
            value: "method"
          - key: "http.status_code"
            value: "status"
      # Node graph visualization
      nodeGraph:
        enabled: true
