# ============================================================================
# KUBERNETES SECRET - Learning Example
# ============================================================================
# A Secret stores SENSITIVE data like passwords, tokens, and keys.
# Data is stored as base64 encoded (NOT encrypted by default!).
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets # Name to reference this Secret

# Type of secret (Opaque is the default for arbitrary data)
# Other types: kubernetes.io/tls, kubernetes.io/dockerconfigjson, etc.
type: Opaque

# ============================================================================
# DATA vs STRINGDATA
# ============================================================================
# You can use either:
# - data: values must be base64 encoded
# - stringData: values are plain text (Kubernetes encodes them for you)

# Using stringData (easier for learning - plain text)
stringData:
  DB_USER: "doit"
  DB_PASSWORD: "doit123"
  JWT_SECRET: "my-super-secret-jwt-key"
  REDIS_PASSWORD: "redis123"
# ============================================================================
# ALTERNATIVE: Using data (base64 encoded)
# ============================================================================
# To encode: echo -n "doit123" | base64  →  ZG9pdDEyMw==
# To decode: echo "ZG9pdDEyMw==" | base64 -d  →  doit123
#
# data:
#   DB_PASSWORD: ZG9pdDEyMw==    # base64 of "doit123"
#   JWT_SECRET: bXktc3VwZXItc2VjcmV0LWp3dC1rZXk=
# ============================================================================

